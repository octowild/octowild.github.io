<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a href="index.html">← Back</a>
</header>

<div class="grid">
  <div class="thumb"><img src="assets/images/111.png"></div>
  <div class="thumb"><img src="assets/images/666.png"></div>
  <div class="thumb"><img src="assets/images/232313.png"></div>
  <div class="thumb"><img src="assets/images/armor.jpg"></div>
  <div class="thumb"><img src="assets/images/blend1.png"></div>
  <div class="thumb"><img src="assets/images/concept.png"></div>
  <div class="thumb"><img src="assets/images/izabell.png"></div>
  <div class="thumb"><img src="assets/images/Lavender.png"></div>
  <div class="thumb"><img src="assets/images/report1.png"></div>
  <div class="thumb"><img src="assets/images/report2.png"></div>
  <div class="thumb"><img src="assets/images/report5.png"></div>
  <div class="thumb"><img src="assets/images/Untitled.png"></div>
  <div class="thumb"><img src="assets/images/Untitled_Artwork.jpg"></div>
  <div class="thumb"><img src="assets/images/Untitled-1.png"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<script>
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  document.querySelectorAll(".thumb img").forEach(img => {
    img.addEventListener("click", () => {
      lightboxImg.src = img.src;
      lightbox.style.display = "flex";
    });
  });

  lightbox.addEventListener("click", () => {
    lightbox.style.display = "none";
  });
</script>

</body>
</html>
